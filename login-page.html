<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediLink Log-In</title>
    <link rel="icon" type="image/jpeg" href="images/logo.png" />
    <link rel="stylesheet" href="login-page.css">
</head>
<body class="page-wrapper">
    <header class="top-header">
        <a href="homepage.html" class="logo">
            <span class="logo-image">
                <img src="images/logo.jpeg" alt="MediLink Logo">
            </span>
            <span class="logo-text">MediLink</span>
        </a>

        <a href="#help" class="help-link">
            <i data-lucide="circle-question-mark"></i> Need help?
        </a>
    </header>

    <main class="main-content">
        <section class="login-card">
            <div class="card-badge"><i data-lucide="heart-pulse"></i></div>
            <h1 class="card-title">Welcome to MediLink</h1>
            <p class="card-subtitle">Log in to manage your health, all in one place.</p>
            <form class="login-form" id="loginForm" novalidate>
  <!-- Email -->
  <div class="form-group">
    <label for="email" class="form-label">Email address</label>
    <div class="input-wrapper">
      <span class="icon-left"><i data-lucide="mail"></i></span>
      <input
        type="email"
        id="email"
        class="form-input with-left-icon"
        placeholder="Enter your email address"
      />
    </div>
  </div>

  <!--Password -->
  <div class="form-group">
    <label for="password" class="form-label">Password</label>
    <div class="input-wrapper">
      <span class="icon-left"><i data-lucide="key-round"></i></span>
      <input
        type="password"
        id="password"
        class="form-input with-left-icon with-right-icon"
        placeholder="Enter your password"
      />
      <button type="button" id="toggle" class="icon-right-btn" aria-label="Toggle password visibility">
        <i data-lucide="eye-off"></i>
      </button>
    </div>
  </div>
  <!--Forgot Password-->
  <div class="form-options">
  <label class="remember-label">
    <input type="checkbox" />
    <span>Remember me</span>
  </label>
  <a href="forgot.html" class="forgot-link">Forgot password?</a>
</div>

<!-- Error message (used by auth.js) -->
<p id="msg" role="alert" style="min-height:20px;margin:0 0 12px;font-size:14px;color:#c0392b;"></p>

<button type="submit" class="submit-btn">Log in →</button>

<hr class="divider" />

<p class="signup-text">
  Don't have an account? <a href="signup.html" class="signup-link">Sign up</a>
</p>
</form>

        </section>
   <p class="security-note"><i data-lucide="shield-check"></i> Your health information stays private and secure.</p>
 </main>

    <footer class="page-footer">
  <span>© 2026 MediLink. All rights reserved.</span>
  <div class="footer-links">
    <a href="#privacy">Privacy policy</a>
    <span>·</span>
    <a href="#terms">Terms of use</a>
  </div>
</footer>

    <script src="https://unpkg.com/lucide@latest"></script>
        <script>
            lucide.createIcons();
        </script>
    <script src="auth.js"></script>
</body>
</html>
